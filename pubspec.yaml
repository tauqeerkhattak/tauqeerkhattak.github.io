name: tauqeer_portfolio
description: Portfolio for Tauqeer Ahmed.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">3.2.0 <=4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # FIREBASE STUFF
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.5

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  auto_size_text: ^3.0.0
  flutter_native_splash: ^2.4.3
  responsive_framework: ^1.5.1

dependency_overrides:
  win32: ^5.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  chopper_generator: ^8.0.3
  json_serializable: ^6.8.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/technologies/

flutter_native_splash:
  color: "#000000"
  image: assets/images/loader.gif
  branding: assets/images/name.png
  android: false
  ios: false